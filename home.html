<!DOCTYPE html>
<html>
    <head>
        <title>
            Number_Guess
        </title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <h1> Welcome to the Number Guessing Game.....: ) </h1>
        <br><br>
        <p>
            You have 10 chances...Each point for each win....
        </p>
        <form id="Game">
            <label for="guessnumber">START YOUR GAME :</label> 
<input type="number" id="guessnumber" placeholder="Enter a number between (1-10)" min="0" max="10">
            <br><br>
            <input type="submit" id="submit" value="SUBMIT">
        </form>
        <p id="Score">SCORE : </p>
        <br><br>
        <p id="Chances">CHANCES:</p> 
        <p id="Message"> </p> 

        <script src="js/scripts.js"></script>  
    </body>

</html>
